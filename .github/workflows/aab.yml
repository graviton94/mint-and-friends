name: Store AAB

# Play 스토어용: 업로드 키(android/keystore/upload.jks.gpg, ANDROID_UPLOAD_PASSPHRASE 로 해제)로 서명한 AAB.
# 직접 실행만 ("릴리즈하자" 이후). versionCode = 1000 + 이 워크플로 실행 번호 (업로드마다 커진다).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "스토어에 보이는 버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"
      track:
        description: "Play 트랙에 바로 출시 (none = 파일만, alpha = 비공개 테스트, internal = 내부 테스트, production = 정식)"
        required: false
        default: "none"
      rollout:
        description: "정식 출시 단계 비율 (0~1, 비우면 전체)"
        required: false
        default: ""
      min_version:
        description: "출시 뒤 원격 설정 min_version_code 도 이 버전으로 (강제 업데이트) true/false"
        required: false
        default: "false"
      store_season:
        description: "출시 뒤 스토어 그래픽 · 스크린샷 · 아이콘도 이 계절로 (spring/summer/autumn/winter, 비우면 그대로)"
        required: false
        default: ""

concurrency:
  group: aab
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test test/

      - name: Firebase settings and login keys
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          WEB: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_APP: ${{ secrets.ADMOB_APP_ID }}
        run: |
          # AdMob 앱 ID 는 앱 안에 그대로 들어가는 공개값 (시크릿이 있으면 그것을 우선)
          A=$(printf %s "$ADMOB_APP" | tr -d '[:space:]'); A=${A:-ca-app-pub-5574169833640769~2022311378}
          echo "HF_ADMOB_APP_ID=$A" >> "$GITHUB_ENV"
          # 스토어 빌드에 테스트 광고가 섞이지 않게: 광고 단위 시크릿이 없으면 멈춘다
          for n in ADMOB_REWARDED ADMOB_INTERSTITIAL; do
            v=$(printenv "$n" | tr -d '[:space:]')
            case "$v" in ca-app-pub-*/*) ;; *) echo "::error::$n 시크릿이 없거나 형식이 다릅니다 (ca-app-pub-…/…)"; exit 1 ;; esac
            case "$v" in ca-app-pub-3940256099942544/*) echo "::error::$n 이 Google 테스트 ID 입니다"; exit 1 ;; esac
          done
          python3 tool/ci_defines.py > "$RUNNER_TEMP/app.defines"
          echo "dart-define: $(wc -l < "$RUNNER_TEMP/app.defines") values"
          K=$(printf %s "$KAKAO" | tr -d '[:space:]'); if [ -n "$K" ]; then echo "HF_KAKAO_NATIVE_APP_KEY=$K" >> "$GITHUB_ENV"; fi

      # Play 업로드 키: build.gradle.kts 가 읽는 네 변수
      - name: Upload signing key
        env:
          P: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          if [ -z "$P" ]; then echo "::error::ANDROID_UPLOAD_PASSPHRASE secret is missing"; exit 1; fi
          if [ ! -f android/keystore/upload.jks.gpg ]; then echo "::error::업로드 키가 없습니다 (android-signing-key.yml 을 upload 로 실행)"; exit 1; fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/upload.jks" android/keystore/upload.jks.gpg 3<<<"$P"
          {
            echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_UPLOAD_KEY_ALIAS=upload"
          } >> "$GITHUB_ENV"

      - name: Build AAB
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          set -o pipefail
          V="${{ inputs.version }}"
          N=$((1000 + ${{ github.run_number }}))
          echo "CODE=$N" >> "$GITHUB_ENV"
          flutter build appbundle --release --build-number "$N" --build-name "$V" \
            $(cat "$RUNNER_TEMP/app.defines") 2>&1 | tee build.log
          mkdir -p out
          cp build/app/outputs/bundle/release/app-release.aab "out/MintAndFriends-$V-$N.aab"
          ls -la out

      - name: AAB is signed with the upload key
        run: |
          keytool -printcert -jarfile out/*.aab | tee certs.txt | grep -E "Owner|SHA1"
          grep -q "CN=Mint and Friends upload" certs.txt || (echo "::error::AAB is not signed with the upload key" && exit 1)

      - name: Show build errors
        if: failure()
        run: grep -E "error|Error|FAILURE|What went wrong" -A3 build.log | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: MintAndFriends-aab
          path: out/*.aab

      - name: Draft release with the AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="store-${{ inputs.version }}-${CODE}"
          (cd docs && zip -qr "$GITHUB_WORKSPACE/out/store-assets.zip" store)
          gh release create "$T" out/*.aab out/store-assets.zip docs/store/icon_512.png --draft --target "$GITHUB_SHA" \
            --title "Mint & Friends ${{ inputs.version }} (${CODE}) for Play" \
            --notes "Upload this AAB in Play Console (closed testing). Version code ${CODE}, from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."

      # ---- Play 출시 (선택): 서비스 계정 (Play Console 앱 권한) 으로 트랙에 올리고, 원격 설정 최신 버전 갱신
      - uses: google-github-actions/auth@v2
        if: inputs.track != 'none'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: inputs.track != 'none'
      - name: Release to Play
        if: inputs.track != 'none'
        run: |
          pip install -q google-auth requests
          if [ -n "${{ inputs.rollout }}" ] && [ "${{ inputs.track }}" = "production" ]; then
            python3 tool/play_api.py upload out/*.aab "${{ inputs.track }}" "${{ inputs.version }}" inProgress "${{ inputs.rollout }}"
          else
            python3 tool/play_api.py upload out/*.aab "${{ inputs.track }}" "${{ inputs.version }}"
          fi
      # 계절 배포 (D-103): 앱(계절 키 · 홈 아이콘)과 스토어 그래픽을 같은 때 바꾼다
      - name: Store season graphics
        if: inputs.track != 'none' && inputs.store_season != ''
        run: python3 tool/play_api.py feature "${{ inputs.store_season }}" --apply
      - name: Remote Config latest version
        if: inputs.track != 'none'
        run: |
          export ACCESS_TOKEN=$(gcloud auth print-access-token)
          export PROJECT=$(gcloud config get-value project)
          V="latest_version_code=${CODE}"
          if [ "${{ inputs.min_version }}" = "true" ]; then V="$V min_version_code=${CODE}"; fi
          python3 tool/remote_config_set.py $V
