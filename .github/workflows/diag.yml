name: Server logs

# 로그인 함수(login)와 계정 삭제 함수의 최근 로그를 본다 (값 · 토큰은 찍히지 않는다).
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "몇 시간 전까지"
        default: "24"

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Function logs
        env:
          H: ${{ inputs.hours }}
        run: |
          P=$(gcloud config get-value project 2>/dev/null)
          for fn in login deleteaccount; do
            echo "## $fn" | tee -a "$GITHUB_STEP_SUMMARY"
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$fn\"" \
              --project "$P" --freshness="${H}h" --limit 60 --order=asc \
              --format='value(timestamp, severity, httpRequest.status, textPayload, jsonPayload.message)' 2>&1 \
              | grep -v -i "token\":" | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          echo "## Firestore databases" | tee -a "$GITHUB_STEP_SUMMARY"
          gcloud firestore databases list --project "$P" --format='value(name, locationId, type)' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "## Auth providers" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "X-Goog-User-Project: $P" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$P/config" \
            | python3 -c "import json,sys; c=json.load(sys.stdin); s=c.get('signIn',{}); print('anonymous:', s.get('anonymous',{}).get('enabled')); print('error:', c.get('error',{}).get('message'))" | tee -a "$GITHUB_STEP_SUMMARY"
