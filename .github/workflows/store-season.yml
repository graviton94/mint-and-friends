name: Store season

# 시즌 그래픽 이미지와 휴대전화 스크린샷([시즌 표지] + 기존 1~7)을 Play 스토어 등록정보에 올린다.
# 자동: 시즌 시작 사흘 전 (2/26 · 5/29 · 8/29 · 11/28, 한국 오전 10시). 자동 실행은 docs/store/season/AUTO 파일이 있을 때만
# 실제로 바꾸고(정식 출시 때 만든다), 없으면 확인만 한다. 수동: Actions → Store season (season · apply).
on:
  schedule:
    - cron: "0 1 26 2 *"
    - cron: "0 1 29 5 *"
    - cron: "0 1 29 8 *"
    - cron: "0 1 28 11 *"
  workflow_dispatch:
    inputs:
      season:
        description: "spring / summer / autumn / winter"
        required: true
        default: "winter"
      apply:
        description: "true 면 실제로 올린다 (false = 확인만)"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Which season
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            M=$(date -u -d '+3 days' +%m)
            case "$M" in 03) S=spring;; 06) S=summer;; 09) S=autumn;; *) S=winter;; esac
            if [ -f docs/store/season/AUTO ]; then A=--apply; else A=; echo "::notice::AUTO 파일이 없어 확인만 합니다"; fi
          else
            S="${{ inputs.season }}"; A=; [ "${{ inputs.apply }}" = "true" ] && A=--apply
          fi
          echo "SEASON=$S" >> "$GITHUB_ENV"; echo "APPLY=$A" >> "$GITHUB_ENV"
          echo "season=$S apply=${A:-no}"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: pip install -q google-auth requests
      - run: python3 tool/play_api.py feature "$SEASON" $APPLY
