name: Android build

# push        : 분석·테스트·빌드 (시크릿이 있으면 서명, 없으면 디버그 키)
# 태그 v*     : 위 + GitHub Release 에 사이드로드 APK 와 업로드 AAB 첨부
# 수동 실행    : 같음
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 태그 빌드 시 릴리스 생성

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE != '' }}
      HAS_SIDELOAD_KEY: ${{ secrets.SIDELOAD_PASSPHRASE != '' }}
      HAS_APP_CONFIG: ${{ secrets.APP_CONFIG_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/

      # Firebase / Google / 카카오 설정. 없으면 게스트·기기 저장만 되는 빌드가 된다.
      - name: Write app config
        if: env.HAS_APP_CONFIG == 'true'
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          mkdir -p config
          printf '%s' "$APP_CONFIG_JSON" > config/app_config.json
          python3 -c "import json;json.load(open('config/app_config.json'))"

      - name: Dart defines
        id: defines
        run: |
          if [ -f config/app_config.json ]; then
            echo "args=--dart-define-from-file=config/app_config.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: ver
        run: |
          name=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"

      # 암호화된 키스토어 풀기 (android/keystores/*.jks.gpg + 패스프레이즈 시크릿)
      - name: Decrypt sideload keystore
        if: env.HAS_SIDELOAD_KEY == 'true' && hashFiles('android/keystores/sideload.jks.gpg') != ''
        env:
          SIDELOAD_PASSPHRASE: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SIDELOAD_PASSPHRASE" \
            -o "$RUNNER_TEMP/sideload.jks" -d android/keystores/sideload.jks.gpg
          echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Decrypt upload keystore
        if: env.HAS_UPLOAD_KEY == 'true' && hashFiles('android/keystores/upload.jks.gpg') != ''
        env:
          ANDROID_UPLOAD_PASSPHRASE: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$ANDROID_UPLOAD_PASSPHRASE" \
            -o "$RUNNER_TEMP/upload.jks" -d android/keystores/upload.jks.gpg
          echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build sideload APK
        env:
          SIGNING_PROFILE: sideload
          SIDELOAD_PASSPHRASE: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          flutter build apk --release ${{ steps.defines.outputs.args }} \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}
          mkdir -p dist
          signed=$([ -n "${SIDELOAD_KEYSTORE:-}" ] && echo sideload || echo debugsigned)
          cp build/app/outputs/flutter-apk/app-release.apk "dist/mint-and-friends-${{ steps.ver.outputs.name }}-${signed}.apk"

      - name: Build upload AAB
        env:
          SIGNING_PROFILE: upload
          ANDROID_UPLOAD_PASSPHRASE: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          flutter build appbundle --release ${{ steps.defines.outputs.args }} \
            --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}
          signed=$([ -n "${ANDROID_UPLOAD_KEYSTORE:-}" ] && echo upload || echo debugsigned)
          cp build/app/outputs/bundle/release/app-release.aab "dist/mint-and-friends-${{ steps.ver.outputs.name }}-${signed}.aab"

      - name: Clean keystores
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks config/app_config.json

      - uses: actions/upload-artifact@v4
        with:
          name: mint-and-friends-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
