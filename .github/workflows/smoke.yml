name: Launch smoke test

# 릴리스 빌드(x86_64, 시험 키 서명)를 에뮬레이터에서 실행해 바로 꺼지는지 확인한다.
# 꺼지면 크래시 로그를 실행 요약과 아티팩트(logcat)로 남긴다.
on:
  push:
    paths: ["android/**", "pubspec.yaml", "pubspec.lock", "lib/main.dart", "lib/services/**", ".github/workflows/smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Sideload signing key
        env:
          P: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          if [ -n "$P" ] && [ -f android/keystore/sideload.jks.gpg ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/sideload.jks" android/keystore/sideload.jks.gpg 3<<<"$P"
            echo "HF_SIDELOAD_STORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          fi

      - name: Firebase settings and login keys
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          WEB: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          python3 tool/ci_defines.py > "$RUNNER_TEMP/app.defines"
          K=$(printf %s "$KAKAO" | tr -d '[:space:]'); if [ -n "$K" ]; then echo "HF_KAKAO_NATIVE_APP_KEY=$K" >> "$GITHUB_ENV"; fi

      - name: Build release APK (x86_64)
        env:
          HF_SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          flutter build apk --release --target-platform android-x64 $(cat "$RUNNER_TEMP/app.defines")
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/app.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tool/smoke_launch.sh "$RUNNER_TEMP/app.apk" io.github.graviton94.mintandfriends

      - name: Crash log
        if: always()
        run: |
          [ -f smoke/crash.txt ] && cat smoke/crash.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: smoke/
