name: Secrets check

# Actions 시크릿이 쓸 수 있는 상태인지 값은 찍지 않고 확인한다.
# 공개해도 되는 사실만 찍는다: Firebase 프로젝트 id, 패키지 이름, SHA 지문 등록 여부, 암호 길이.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEB: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
          P_SIDE: ${{ secrets.SIDELOAD_PASSPHRASE }}
          P_UP: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          PKG = "io.github.graviton94.mintandfriends"
          bad = []
          def say(s): print(s + "  ")
          say("## 서명 암호")
          a, b = os.environ.get("P_SIDE", ""), os.environ.get("P_UP", "")
          say(f"- SIDELOAD_PASSPHRASE: {'set' if a else 'MISSING'}, {len(a)} chars {'(ok)' if len(a) >= 16 else '(16자 이상 필요)'}")
          say(f"- ANDROID_UPLOAD_PASSPHRASE: {'set' if b else 'MISSING'}, {len(b)} chars {'(ok)' if len(b) >= 16 else '(16자 이상 필요)'}")
          if a and a == b:
              say("- 두 암호가 같습니다 (달라야 함)"); bad.append("same passphrase")
          say(f"- 키 파일: sideload {'있음' if os.path.exists('android/keystore/sideload.jks.gpg') else '없음'}, upload {'있음' if os.path.exists('android/keystore/upload.jks.gpg') else '없음'}")
          say("## GOOGLE_SERVICES_JSON")
          gproj = None
          try:
              g = json.loads(os.environ.get("GSJ", ""))
              gproj = g["project_info"]["project_id"]
              say(f"- project_id `{gproj}`")
              clients = g.get("client", [])
              pkgs = [c["client_info"]["android_client_info"]["package_name"] for c in clients]
              say(f"- 들어 있는 앱: {', '.join('`' + p + '`' for p in pkgs)}")
              mine = [c for c in clients if c["client_info"]["android_client_info"]["package_name"] == PKG]
              if not mine:
                  say(f"- **`{PKG}` 앱이 없음** (Firebase 콘솔에서 Android 앱 추가 후 json 다시 받기)"); bad.append("package")
              else:
                  sha = [o for o in mine[0].get("oauth_client", []) if o.get("client_type") == 1]
                  allo = [o for cl in clients for o in cl.get("oauth_client", [])] + [o for cl in clients
                          for o in cl.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", [])]
                  web = [o for o in allo if o.get("client_type") == 3]
                  alt = bool(os.environ.get("WEB"))
                  say(f"- Android OAuth(SHA 등록) {len(sha)}개, 웹 클라이언트 {len(web)}개, GOOGLE_WEB_CLIENT_ID 시크릿 {'있음' if alt else '없음'}")
                  if not web and not alt:
                      say("- **Google 로그인 불가**: Authentication 에서 Google 로그인을 켠 뒤 json 을 다시 받거나, 웹 클라이언트 ID 를 GOOGLE_WEB_CLIENT_ID 시크릿으로"); bad.append("google web client")
          except Exception as e:
              say(f"- **사용 불가**: {type(e).__name__}"); bad.append("google-services")
          say("## FIREBASE_SERVICE_ACCOUNT")
          try:
              s = json.loads(os.environ.get("SA", ""))
              say(f"- type `{s.get('type')}`, project_id `{s.get('project_id')}`")
              if gproj and s.get("project_id") != gproj:
                  say("- **google-services.json 과 프로젝트가 다름**"); bad.append("sa project")
          except Exception as e:
              say(f"- **사용 불가**: {type(e).__name__}"); bad.append("service account")
          say("## 카카오")
          k = os.environ.get('KAKAO', ''); kid = os.environ.get('KAKAO_APP_ID', '')
          say(f"- KAKAO_NATIVE_APP_KEY: {'set' if k else 'MISSING'}, {len(k.strip())}자 (보통 32자, 16진수){', **앞뒤 공백/줄바꿈 있음**' if k != k.strip() else ''}{'' if all(c in '0123456789abcdef' for c in k.strip()) else ', **16진수가 아닌 글자 있음**'}")
          if k and len(k.strip()) != 32: bad.append("kakao key length")
          say(f"- KAKAO_APP_ID: {'set' if kid else '없음'}{'' if not kid or kid.strip().isdigit() else ', **숫자가 아님 (앱 ID 는 숫자)**'}")
          if kid and not kid.strip().isdigit(): bad.append("kakao app id")
          say("")
          say("**문제 없음**" if not bad else f"**확인 필요: {', '.join(bad)}**")
          PY
