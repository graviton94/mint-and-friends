name: Notify probe

# 진단: 릴리스 빌드(NOTIFY_PROBE)를 에뮬레이터에서 켜면 앱이 알림 권한 확인 · 즉시 알림 · 예약 알림을 실행하고
# 단계별 결과를 'NOTIFYPROBE' 로그로 남긴다. 실행 요약 · 아티팩트(logcat · 화면)로 본다.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sideload signing key
        env:
          P: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          if [ -n "$P" ] && [ -f android/keystore/sideload.jks.gpg ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/sideload.jks" android/keystore/sideload.jks.gpg 3<<<"$P"
            echo "HF_SIDELOAD_STORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          fi
      - name: Firebase settings and login keys
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          WEB: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          python3 tool/ci_defines.py > "$RUNNER_TEMP/app.defines"
          K=$(printf %s "$KAKAO" | tr -d '[:space:]'); if [ -n "$K" ]; then echo "HF_KAKAO_NATIVE_APP_KEY=$K" >> "$GITHUB_ENV"; fi
      - name: Build release APK (x86_64, notify probe)
        env:
          HF_SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          flutter build apk --release --target-platform android-x64 --dart-define=NOTIFY_PROBE=true $(cat "$RUNNER_TEMP/app.defines")
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/app.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run probe on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tool/notify_probe.sh "$RUNNER_TEMP/app.apk" io.github.graviton94.mintandfriends
      - name: Probe log
        if: always()
        run: |
          [ -f probe/summary.txt ] && cat probe/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notify-probe
          path: probe/
